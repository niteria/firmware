name: build-one
on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build (e.g. hi3516cv100_lite)'
        required: true

env:
  TAG_NAME: latest

jobs:
  buildroot:
    name: Firmware (${{inputs.platform}})
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Prepare firmware
        run: |
          echo "nameserver 8.8.8.8" | sudo tee /etc/resolv.conf
          echo CACHE_DATE=$(date +%m) >> ${GITHUB_ENV}

      - name: Setup ccache
        uses: actions/cache@v4
        with:
          path: /tmp/ccache
          key: ${{inputs.platform}}-${{env.CACHE_DATE}}

      - name: Build firmware
        run: |
          export GIT_HASH=$(git rev-parse --short ${GITHUB_SHA})
          export GIT_BRANCH=${GITHUB_REF_NAME}
          echo GIT_HASH=${GIT_HASH} >> ${GITHUB_ENV}
          echo GIT_BRANCH=${GIT_BRANCH} >> ${GITHUB_ENV}

          mkdir -p /tmp/ccache
          ln -s /tmp/ccache ${HOME}/.ccache
          make BOARD=${{inputs.platform}}

          TIME=$(date -d @${SECONDS} +%M:%S)
          echo TIME=${TIME} >> ${GITHUB_ENV}

          NORFW=$(find output/images -name openipc*nor*)
          if [ -e ${NORFW} ]; then
            echo NORFW=${NORFW} >> ${GITHUB_ENV}
          fi

          NANDFW=$(find output/images -name openipc*nand*)
          if [ -e ${NANDFW} ]; then
            echo NANDFW=${NANDFW} >> ${GITHUB_ENV}
          fi

          if [ -e "${NORFW}" ]; then
            platform=${{inputs.platform}}
            soc=${platform%_*}
            variant=${platform##*_}
            image_soc=${soc}
            link=https://github.com/openipc/firmware/releases/download/latest

            case "${soc}" in
              t10|t20|t21|t23|t30|t31)
                image_soc="${soc}n"
                ;;
            esac

            uboot="u-boot-${image_soc}-nor.bin"
            norbin="output/images/openipc-${image_soc}-nor-${variant}.bin"
            workdir=$(mktemp -d)

            if wget -nv ${link}/${uboot} -O "${workdir}/${image_soc}.bin"; then
              tar -xf "${NORFW}" -C "${workdir}"
              kernel=$(find "${workdir}" -maxdepth 1 -name 'uImage.*' | head -1)
              rootfs=$(find "${workdir}" -maxdepth 1 -name 'rootfs.squashfs.*' | head -1)

              if [ -n "${kernel}" ] && [ -n "${rootfs}" ]; then
                dd if=/dev/zero bs=1K count=5000 status=none | tr '\000' '\377' > "${norbin}"
                dd if="${workdir}/${image_soc}.bin" of="${norbin}" bs=1K seek=0 conv=notrunc status=none
                dd if="${kernel}" of="${norbin}" bs=1K seek=320 conv=notrunc status=none
                dd if="${rootfs}" of="${norbin}" bs=1K seek=2368 conv=notrunc status=none
                echo NORBIN=${norbin} >> ${GITHUB_ENV}
              fi
            fi

            rm -rf "${workdir}"
          fi

      - name: Upload firmware
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{env.TAG_NAME}}
          files: |
            ${{env.NORFW}}
            ${{env.NORBIN}}
            ${{env.NANDFW}}
